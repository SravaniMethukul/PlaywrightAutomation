name: Playwright Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Tags to execute"
        required: false
        default: "@e2e"
        type: choice
        options:
          - "@smoke"
          - "@regression"
          - "@e2e"
          - "@performance"
          - "@web"
          - "@api"

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      #FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # Opt into Node.js 24
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true # Temporarily allow Node.js 20

    steps:
      - uses: actions/checkout@v5 # Updated to the latest secure version
      - uses: actions/setup-node@v5 # Updated to the latest secure version
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: |
          if [ "${{ github.event.inputs.tag }}" != "" ]; then
            npx playwright test --grep "${{ github.event.inputs.tag }}"
          else
            npx playwright test
          fi
      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v7 # Updated to the latest secure version
        with:
          name: playwright-html-report
          path: playwright-report/
      - name: Generate Allure Report
        run: npx allure generate allure-results --clean -o allure-report
      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v7 # Upload Allure report as artifact
        with:
          name: allure-report
          path: allure-report/
      - name: Upload Test Videos
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-videos
          path: test-results/
